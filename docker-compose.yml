services:
  postgres:
    image: postgres:15-alpine
    container_name: kpsy_multisector_postgres
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kpsy_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kpsy_multisector_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kpsy_user -d kpsy_multisector_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kpsy_multisector_backend
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SMTP_HOST: "sandbox.smtp.mailtrap.io"
      SMTP_PORT: "2525"
      SMTP_USER: "testuser"
      SMTP_PASS: "testpass"
      SMTP_FROM: '"SaaS UEMOA" <noreply@saas-uemoa.com>'
      ADMIN_EMAIL: "admin@saas-uemoa.com"
    volumes:
      - ./backend/prisma/migrations:/app/prisma/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kpsy_multisector_frontend
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:

